version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /plugins.v2/storagecleanup
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      plugin-dependencies:
        patterns:
          - "*"
