name: Lockfile security fix

on:
  push:
    branches:
      - agent/fix-nanoid-audit

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nanoid-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Apply npm production security fix
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile fix
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable nanoid lockfile"
          git push origin HEAD:agent/fix-nanoid-audit
