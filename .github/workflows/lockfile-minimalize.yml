name: Minimize nanoid lockfile patch

on:
  push:
    branches:
      - agent/fix-nanoid-audit

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nanoid-audit
          fetch-depth: 0
      - name: Restore lockfile and apply only nanoid patch
        run: |
          git fetch origin main
          git checkout origin/main -- package-lock.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package-lock.json')
          data = json.loads(path.read_text())
          entry = data['packages']['node_modules/nanoid']
          if entry.get('version') != '3.3.16':
              raise SystemExit(f"unexpected nanoid version: {entry.get('version')}")
          entry['version'] = '3.3.18'
          entry['resolved'] = 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz'
          entry['integrity'] = 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w=='
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git diff --check
      - name: Commit minimal lockfile patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable nanoid to 3.3.18"
          git push origin HEAD:agent/fix-nanoid-audit
